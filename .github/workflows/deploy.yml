# Julkaisu GitHub Pagesiin.
# Pohjana Viten virallinen ohje: https://vite.dev/guide/static-deploy (tarkistettu 2026-10-24).
# Ota käyttöön repon asetuksista: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Julkaise GitHub Pagesiin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hae koodi
        uses: actions/checkout@v7

      - name: Asenna Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testit
        run: npm test

      - name: Build (sisältö validoidaan buildissa)
        run: npm run build
        env:
          # Sivu julkaistaan osoitteeseen https://<käyttäjä>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Määritä Pages
        uses: actions/configure-pages@v6

      - name: Lähetä build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Julkaise
        id: deployment
        uses: actions/deploy-pages@v5
