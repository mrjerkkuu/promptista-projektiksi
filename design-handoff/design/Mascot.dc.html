<script type="text/x-dc" data-dc-script data-props='{"pose":{"editor":"enum","options":["wave","cheer","think","point","rest"],"default":"wave"},"size":{"editor":"int","min":40,"max":400,"default":280},"$preview":{"width":320,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const pose = this.props.pose ?? 'wave';
    return {
      size: this.props.size ?? 280,
      isWave: pose === 'wave',
      isCheer: pose === 'cheer',
      isThink: pose === 'think',
      isPoint: pose === 'point',
      isRest: pose === 'rest'
    };
  }
}
</script>
