<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Merkki-ilmoitus</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=Figtree:wght@400..700&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pp-root" style="width: 100%; box-sizing: border-box; min-height: {{minh}}px; padding: {{pad}}px; background: {{bg}}; display: flex; align-items: flex-end; justify-content: flex-end;">
  <div class="pp-toast-stack" aria-live="polite" style="width: min(24rem, 100%);">
    <sc-for list="{{toasts}}" as="t" hint-placeholder-count="1">
      <div role="status" class="pp-anim-toast" style="position: relative; width: 100%; display: flex; gap: 14px; align-items: flex-start; padding: 16px 16px 16px 14px; background: var(--surface); border: 1.5px solid var(--t1-line); border-radius: 22px; box-shadow: var(--shadow-lg);">
        <div class="pp-anim-pop" style="flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--t1); border: 2px solid var(--t1-line); display: flex; align-items: center; justify-content: center; color: var(--t1-ink);">
          <svg class="pp-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px; stroke-width: 1.7;"><path d="{{t.icon}}"></path></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
          <strong class="pp-serif" style="font-size: 18px; line-height: 1.25; overflow-wrap: anywhere;">Uusi merkki: {{t.name}}!</strong>
          <span style="font-size: 14px; line-height: 1.5; color: var(--ink-2);">{{t.desc}}</span>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 4px;">
            <a href="AppBadges.dc.html" style="font-size: 14px; font-weight: 600;">Katso merkit</a>
            <button type="button" class="pp-btn pp-btn-secondary pp-btn-sm" style="min-height: 40px; padding: 0 14px; font-size: 14px;">Sulje</button>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"count":{"editor":"int","min":1,"max":2,"default":1},"framed":{"editor":"boolean","default":true},"$preview":{"width":720,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const framed = this.props.framed ?? true;
    const all = [
      { name: 'Ensimmäinen komento', desc: 'Kirjoitit ensimmäisen komentosi terminaaliin. Siitä se lähtee!', icon: 'M3 6h18v12H3zM7 10h.01M11 10h.01M15 10h.01M7 14h10' },
      { name: 'Perusteet hallussa', desc: 'Kävit läpi kaikki perusteet: vibekoodauksen, terminaalin, kansiot, Gitin ja agentit.', icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15.5 8.5l-2 5-5 2 2-5z' }
    ];
    const n = Math.max(1, Math.min(2, this.props.count ?? 1));
    return { toasts: all.slice(0, n), pad: framed ? 32 : 0, minh: framed ? 300 : 0, bg: framed ? 'var(--bg)' : 'transparent' };
  }
}
</script>
</body>
</html>
