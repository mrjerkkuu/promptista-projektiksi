<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Muut erikoistilanteet 360 px</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=Figtree:wght@400..700&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pp-root" style="width: 3000px; min-height: 5400px; box-sizing: border-box; padding: 48px; display: flex; gap: 64px; align-items: flex-start; background: var(--surface-2);">
  <div style="flex: none; width: 360px; display: flex; flex-direction: column; gap: 12px;"><span class="pp-overline" style="color: var(--ink-2);">Merkit · 0/9 (tyhjä)</span><div style="width: 360px; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow-md);"><dc-import name="AppBadges" earned="0" hint-size="360px,2400px"></dc-import></div></div>
  <div style="flex: none; width: 360px; display: flex; flex-direction: column; gap: 12px;"><span class="pp-overline" style="color: var(--ink-2);">Merkit · 9/9</span><div style="width: 360px; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow-md);"><dc-import name="AppBadges" earned="9" hint-size="360px,2400px"></dc-import></div></div>
  <div style="flex: none; width: 360px; display: flex; flex-direction: column; gap: 12px;"><span class="pp-overline" style="color: var(--ink-2);">Merkki-ilmoitukset pinossa</span><div style="width: 360px; height: 760px; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow-md); background: var(--bg); display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box;"><dc-import name="BadgeToast" count="{{two}}" framed="{{no}}" hint-size="328px,360px"></dc-import></div></div>
  <div style="flex: none; width: 360px; display: flex; flex-direction: column; gap: 12px;"><span class="pp-overline" style="color: var(--ink-2);">Sanasto · /sanasto/terminaali korostettu</span><div style="width: 360px; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow-md);"><dc-import name="AppGlossary" highlight="terminaali" hint-size="360px,5000px"></dc-import></div></div>
  <div style="flex: none; width: 360px; display: flex; flex-direction: column; gap: 12px;"><span class="pp-overline" style="color: var(--ink-2);">Vianmääritys · ei valintaa, kaikki 15</span><div style="width: 360px; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow-md);"><dc-import name="AppTrouble" os="none" open="" hint-size="360px,2400px"></dc-import></div></div>
  <div style="flex: none; width: 360px; display: flex; flex-direction: column; gap: 12px;"><span class="pp-overline" style="color: var(--ink-2);">Vianmääritys · Mac, suoraan linkitetty kohta</span><div style="width: 360px; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow-md);"><dc-import name="AppTrouble" os="Mac" open="mac-tyokalut" hint-size="360px,2600px"></dc-import></div></div>
  <div style="flex: none; width: 360px; display: flex; flex-direction: column; gap: 12px;"><span class="pp-overline" style="color: var(--ink-2);">Polku · kaikki valmis</span><div style="width: 360px; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow-md);"><dc-import name="AppPath" state="done" hint-size="360px,5000px"></dc-import></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3000,"height":5400}}'>
class Component extends DCLogic {
  renderVals() { return { two: 2, no: false }; }
}
</script>
</body>
</html>
